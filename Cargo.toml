[package]
name = "webdriverbidi"
version = "0.5.0"
edition = "2024"
authors = ["Taha Hachana <tahahachana@gmail.com>"]
description = "WebDriver BiDi client implementation in Rust."
license = "MIT"
repository = "https://github.com/TahaHachana/webdriverbidi"
rust-version = "1.85"
readme = "README.md"
keywords = ["webdriver", "bidi", "browser", "automation", "testing"]
categories = ["development-tools::testing", "web-programming", "asynchronous"]
# Ship only what users need; tests, fixtures, scripts and notes stay in the repo.
include = ["src/**/*.rs", "examples/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
tokio = { version = "1.47.0", features = ["full"] }
tokio-tungstenite = "0.27.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
futures = "0.3.31"
reqwest = { version = "0.12.22", default-features = false, features = ["json"] }
thiserror = "2.0.12"
log = "0.4.27"

[dev-dependencies]
anyhow = "1.0.98"
axum = "0.8.4"
cddl = "0.10.7"

# Speeds up CDDL parsing in the conformance and live tests (applies only when
# building this repository, not to crates that depend on it).
[profile.dev.package.cddl]
opt-level = 3
