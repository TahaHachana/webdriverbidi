name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: cargo fmt --check
    - name: Build
      run: cargo build --verbose
    - name: Unit and spec conformance tests (no browser needed)
      run: cargo test --verbose --lib --test cddl_conformance

  integration:
    # Live tests against headless browsers (Chrome and Firefox are preinstalled
    # on GitHub's Ubuntu runners).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            driver: chromedriver
          - browser: firefox
            driver: geckodriver
    env:
      WEBDRIVERBIDI_BROWSER: ${{ matrix.browser }}

    steps:
    - uses: actions/checkout@v4
    - name: Install ${{ matrix.driver }}
      run: scripts/install-${{ matrix.driver }}.sh
    - name: Start ${{ matrix.driver }}
      run: |
        drivers/${{ matrix.driver }} --port=4444 > driver.log 2>&1 &
        for _ in $(seq 30); do curl -sf localhost:4444/status > /dev/null && exit 0; sleep 1; done
        cat driver.log; exit 1
    - name: Integration tests (${{ matrix.browser }})
      run: cargo test --verbose --tests -- --test-threads=1
    - name: Driver log
      if: failure()
      run: cat driver.log
